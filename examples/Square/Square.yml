# Square lattice, t = -1. Paths are relative to this file.
data_dir: data

beta: 20.0
k_size: 48
directions: [0, 1, 2, 3]
fillings:
  min: 0.3
  max: 0.5
  n: 5

# TightBindingToolkit high-symmetry points; the path closes back to the first.
k_points: [G, M1, M2]
k_labels: ['\Gamma', 'X', 'M']

# On-site U and the reach of the 1/r tail, in units of e^2/(eps a) and of a.
coulomb:
  onsite: 4.0
  range: 3.0

instability:
  lower: 0.0
  upper: 10.0
